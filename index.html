<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>命のバトン恐竜ラン(仮) - プロトタイプ</title>
<style>
  @font-face {
    font-family: "NegaTape";
    src: url("assets/fonts/x5y8pxNegaTape.woff2") format("woff2"),
         url("assets/fonts/x5y8pxNegaTape.ttf") format("truetype");
    font-display: block; /* 読み込み中は文字を出さず、フォント確定後にまとめて表示する */
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #eeeeee;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden; /* 画面に収まるよう縮小表示するので、はみ出し分のスクロールは出さない */
  }
  #gameRoot {
    display: flex;
    flex-direction: column;
    align-items: center;
    transform-origin: center center;
  }
  canvas {
    background: #ffffff;
    border: 2px solid #333333;
    touch-action: none;
    display: block;
  }
  .game-wrap {
    position: relative;
    line-height: 0; /* canvas下の余白でボタン位置がずれるのを防ぐ */
  }
  #pauseBtn {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 30px;
    height: 30px;
    font: 16px "NegaTape", monospace;
    line-height: 1;
    background: rgba(255, 255, 255, 0.8);
    border: 1px solid #333333;
    cursor: pointer;
    display: none; /* ゲームプレイ中だけgame.jsが表示する */
  }
  #shareBtn {
    display: none; /* 結果画面(ゲームオーバー中)だけgame.jsが表示する */
    margin: 10px auto 0;
    width: 30px;
    height: 30px;
    padding: 0;
    font: 18px "NegaTape", monospace;
    line-height: 1;
    background: #ffffff;
    border: 1px solid #333333;
    cursor: pointer;
  }
  /* タッチ操作用の方向ボタン: 左端中央に左右移動、右端中央に上下(ジャンプ/しゃがみ) */
  .dirBtn {
    position: absolute;
    width: 44px;
    height: 44px;
    padding: 0;
    border: none;
    background: url("assets/button.png") no-repeat center / contain;
    opacity: 0.85;
    touch-action: none;
    display: none; /* タッチ操作端末でプレイ中だけgame.jsが表示する */
  }
  .dirBtn.pressed {
    background-image: url("assets/button-pressed.png");
  }
  #btnLeft { left: 12px; top: 130px; transform: rotate(-90deg); }
  #btnRight { left: 64px; top: 130px; transform: rotate(90deg); }
  #btnUp { right: 12px; top: 104px; }
  #btnDown { right: 12px; top: 156px; transform: rotate(180deg); }
</style>
</head>
<body>
<div id="gameRoot">
  <div class="game-wrap">
    <canvas id="game"></canvas>
    <button id="pauseBtn" aria-label="pause">||</button>
    <button id="btnLeft" class="dirBtn" aria-label="left"></button>
    <button id="btnRight" class="dirBtn" aria-label="right"></button>
    <button id="btnUp" class="dirBtn" aria-label="up"></button>
    <button id="btnDown" class="dirBtn" aria-label="down"></button>
  </div>
  <button id="shareBtn" aria-label="share to X">X</button>
</div>
<script src="config.js"></script>
<script src="game.js"></script>
</body>
</html>
